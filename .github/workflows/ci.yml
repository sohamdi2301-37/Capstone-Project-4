name: CI
on:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive
      - name: Terraform init and validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
      - name: Build Docker image
        run: docker build -t capstone-app:${{ github.sha }} ./app
      - name: Smoke test container
        run: |
          docker run -d --name capstone-test -p 18080:8080 capstone-app:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl --fail http://localhost:18080/health; then exit 0; fi
            sleep 2
          done
          docker logs capstone-test
          exit 1
